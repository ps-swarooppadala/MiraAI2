<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Mira.ai - Prepare your space</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#1b1c1a",
                        "surface": "#f1fcf7",
                        "on-surface-variant": "#414845",
                        "surface-dim": "#d1ddd8",
                        "outline-variant": "#c0c8c3",
                        "primary": "#00241a",
                        "on-background": "#141e1b",
                        "background": "#f1fcf7",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#dae5e0",
                        "inverse-surface": "#28332f",
                        "tertiary-fixed-dim": "#e9c349",
                        "primary-fixed": "#bfecd9",
                        "outline": "#717974",
                        "on-surface": "#141e1b",
                        "on-primary-fixed-variant": "#244e40",
                        "surface-tint": "#3c6657",
                        "on-primary-fixed": "#002117",
                        "secondary": "#5e5e5c",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#ebf6f1",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#e4e2de",
                        "surface-container-high": "#dfebe6",
                        "secondary-fixed-dim": "#c8c6c3",
                        "primary-fixed-dim": "#a3d0be",
                        "inverse-on-surface": "#e8f3ee",
                        "secondary-container": "#e1dfdc",
                        "primary-container": "#0e3b2e",
                        "tertiary-fixed": "#ffe088",
                        "tertiary": "#735c00",
                        "on-secondary-container": "#636360",
                        "on-primary-container": "#7aa694",
                        "surface-container": "#e5f0eb",
                        "surface-bright": "#f1fcf7",
                        "surface-container-highest": "#dae5e0",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#cba72f",
                        "inverse-primary": "#a3d0be",
                        "on-secondary-fixed-variant": "#474744",
                        "on-tertiary-fixed": "#241a00",
                        "on-tertiary-container": "#4e3d00",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "40px",
                        "stack-sm": "12px",
                        "unit": "8px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["DM Sans"],
                        "label-sm": ["DM Sans"],
                        "body-md": ["DM Sans"],
                        "headline-md": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "hero": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "body-lg": ["DM Sans"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "hero": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f1fcf7;
            color: #141e1b;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:items-center md:justify-center overflow-x-hidden">
<!-- Suppressed TopAppBar and BottomNavBar because this is a transactional/setup flow screen -->
<main class="flex-1 w-full max-w-md mx-auto px-container-padding py-stack-lg flex flex-col relative">
<!-- Ambient Background Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120%] h-[120%] -z-10 bg-[radial-gradient(ellipse_at_top_right,rgba(191,236,217,0.4)_0%,transparent_70%)] pointer-events-none rounded-full blur-3xl opacity-60"></div>
<header class="mb-stack-lg animate-fade-in-up" style="animation: fadeInUp 0.6s ease-out forwards;">
<div class="flex items-center justify-between mb-stack-md text-primary">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<span class="font-hero text-headline-md text-primary tracking-tight">Mira.ai</span>
<div class="w-12"></div> <!-- Spacer for balance -->
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary text-center">Prepare your space</h1>
</header>
<div class="flex flex-col gap-stack-md flex-1 w-full justify-center">
<!-- Tip 1 -->
<div class="flex gap-gutter items-start p-stack-sm rounded-DEFAULT hover:bg-surface-container-low transition-colors duration-300 opacity-0 group" style="animation: fadeInUp 0.6s ease-out 0.2s forwards;">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[28px]" data-icon="open_with">open_with</span>
</div>
<div class="flex flex-col pt-1">
<h3 class="font-label-md text-label-md text-primary mb-1">Clear a 6ft space</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Ensure you have room to move freely.</p>
</div>
</div>
<!-- Tip 2 -->
<div class="flex gap-gutter items-start p-stack-sm rounded-DEFAULT hover:bg-surface-container-low transition-colors duration-300 opacity-0 group" style="animation: fadeInUp 0.6s ease-out 0.4s forwards;">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[28px]" data-icon="light_mode">light_mode</span>
</div>
<div class="flex flex-col pt-1">
<h3 class="font-label-md text-label-md text-primary mb-1">Natural lighting</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Face a light source so I can see you clearly.</p>
</div>
</div>
<!-- Tip 3 -->
<div class="flex gap-gutter items-start p-stack-sm rounded-DEFAULT hover:bg-surface-container-low transition-colors duration-300 opacity-0 group" style="animation: fadeInUp 0.6s ease-out 0.6s forwards;">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[28px]" data-icon="stay_current_portrait">stay_current_portrait</span>
</div>
<div class="flex flex-col pt-1">
<h3 class="font-label-md text-label-md text-primary mb-1">Device placement</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Prop your phone at waist height, about 5ft away.</p>
</div>
</div>
</div>
<div class="mt-stack-lg opacity-0 flex justify-center w-full" style="animation: fadeInUp 0.6s ease-out 0.8s forwards;">
<button class="w-full sm:w-auto min-w-[200px] px-8 py-4 bg-[#E6BE8A] text-primary rounded-full font-label-md text-label-md shadow-[0_8px_20px_rgba(14,59,46,0.12)] hover:shadow-[0_12px_24px_rgba(14,59,46,0.18)] hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2">
                I'm ready
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 400;">arrow_forward</span>
</button>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body></html>
