</div>
<!-- Real-time Skeleton Overlay (SVG) -->

<filter height="140%" id="gold-glow" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="1.5"></feGaussianBlur>

<g class="text-tertiary-fixed-dim" fill="none" filter="url(#gold-glow)" opacity="0.85" stroke="currentColor">

<line stroke-width="0.35" x1="68" x2="80" y1="38" y2="34"></line>
<line stroke-width="0.35" x1="35" x2="25" y1="35" y2="42"></line>
<!-- Spine/Torso -->
<line stroke-width="0.4" x1="50" x2="50" y1="32" y2="52"></line>
<!-- Legs -->
<line stroke-width="0.4" x1="50" x2="42" y1="52" y2="72"></line>
<line stroke-width="0.4" x1="42" x2="44" y1="72" y2="88"></line>
<line stroke-width="0.4" x1="50" x2="65" y1="52" y2="68"></line>

<script>
        // Simulate timer filling up slowly for micro-interaction demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const timerCircle = document.querySelector('.timer-circle');
            if(timerCircle) {
                // Circumference is ~201 (2 * pi * 32)
                let offset = 201;
                timerCircle.style.strokeDashoffset = offset;
                
                const interval = setInterval(() => {
                    offset -= 1.5;
                    if(offset <= 60) {
                        offset = 60; // Stop at target visual
                        clearInterval(interval);
                    }
                    timerCircle.style.strokeDashoffset = offset;
                }, 50);
            }
        });
    </script>
