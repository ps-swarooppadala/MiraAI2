<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Mira.ai - Live Coaching Framing</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c0c8c3",
                    "tertiary-container": "#cba72f",
                    "on-secondary-fixed": "#1b1c1a",
                    "inverse-surface": "#28332f",
                    "on-error": "#ffffff",
                    "on-secondary-container": "#636360",
                    "on-primary-fixed": "#002117",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed-dim": "#c8c6c3",
                    "surface-variant": "#dae5e0",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#7aa694",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#a3d0be",
                    "on-surface": "#141e1b",
                    "surface-dim": "#d1ddd8",
                    "secondary-fixed": "#e4e2de",
                    "on-tertiary-fixed": "#241a00",
                    "inverse-on-surface": "#e8f3ee",
                    "on-tertiary-fixed-variant": "#574500",
                    "on-secondary-fixed-variant": "#474744",
                    "tertiary": "#735c00",
                    "surface-container-highest": "#dae5e0",
                    "on-tertiary-container": "#4e3d00",
                    "on-background": "#141e1b",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#e9c349",
                    "on-primary-fixed-variant": "#244e40",
                    "surface": "#f1fcf7",
                    "error": "#ba1a1a",
                    "primary": "#00241a",
                    "secondary": "#5e5e5c",
                    "surface-bright": "#f1fcf7",
                    "primary-fixed": "#bfecd9",
                    "surface-container-high": "#dfebe6",
                    "secondary-container": "#e1dfdc",
                    "primary-container": "#0e3b2e",
                    "surface-container": "#e5f0eb",
                    "tertiary-fixed": "#ffe088",
                    "surface-tint": "#3c6657",
                    "surface-container-low": "#ebf6f1",
                    "on-surface-variant": "#414845",
                    "background": "#f1fcf7",
                    "primary-fixed-dim": "#a3d0be",
                    "on-tertiary": "#ffffff",
                    "outline": "#717974"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "container-padding": "24px",
                    "stack-lg": "40px",
                    "stack-md": "24px",
                    "stack-sm": "12px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "body-lg": ["DM Sans"],
                    "label-md": ["DM Sans"],
                    "headline-lg": ["Playfair Display"],
                    "headline-lg-mobile": ["Playfair Display"],
                    "headline-md": ["Playfair Display"],
                    "body-md": ["DM Sans"],
                    "hero": ["Playfair Display"],
                    "label-sm": ["DM Sans"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],

                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "700"}]

          }
        }
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle breathing animation for the guide overlay */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }
        
        /* Entrance animation for text */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden relative font-body-md text-body-md antialiased">
<!-- Full Screen Camera Feed Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A smartphone camera view of a slightly messy living room, intended as an impromptu workout space. The framing is awkward, cutting off the top and bottom of the view, showing only a torso and a couch corner. Soft, warm morning light filters through a nearby window, casting gentle shadows. The aesthetic is realistic, homey, and slightly disorganized, bathed in a cozy, warm, and inviting natural light that contrasts with the technical need for better framing." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBsSZZh0B8OoQdyyvd5Z3-lg9ImKmzIfCM1wtpLRZUxB0HjsxhQeOouyrXJMaERMbIiJjXJjV_eszHhqk7YnWqJ-Zhnz6P5i9k_Pv4ZN8wSOMXDRcgaSUo09yCam5UjVT6oXOxoqcTTTT0UHrR17xgIH7_2q2VldCBCUd3Rs7tTziPbmC4wBkf2rPl3NWaBPsVEXwYKrjbHQCBinVzYTY-0MZF_ctb--2Z1zF_j_FobwuOktX0qTFEY');">
</div>
<!-- Soft Overlay to ensure text readability without harsh contrast -->
<!-- Using a gradient from a very dark green (primary) to slightly transparent to maintain the 'Quiet Confidence' theme while darkening the image -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/80 via-primary/40 to-primary/80 backdrop-blur-[2px]"></div>
<!-- Main Content Canvas -->
<div class="relative z-10 w-full h-full max-w-7xl mx-auto flex flex-col items-center justify-between py-stack-lg px-container-padding">
<!-- Top Section: Encouraging Message -->
<div class="mt-8 flex flex-col items-center text-center max-w-lg animate-fade-up">
<span class="material-symbols-outlined text-4xl text-primary-fixed mb-4" style="font-variation-settings: 'FILL' 1;">
                accessibility_new
            </span>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-primary">
                Take a step back, Sarah.<br>Let's get your whole body in view.
            </h1>
<p class="font-body-lg text-body-lg text-primary-fixed-dim mt-stack-sm opacity-90">
                I need to see your head and feet to guide your form correctly.
            </p>
</div>
<!-- Center Section: Silhouette Guide -->
<div class="relative flex items-center justify-center animate-breathe mt-8">
<!-- Outer dashed boundary representing the ideal frame -->
<div class="w-[280px] h-[400px] md:w-[320px] md:h-[480px] border-[3px] border-dashed border-primary-fixed rounded-full flex flex-col items-center justify-center relative shadow-[0_0_60px_rgba(191,236,217,0.15)] bg-primary/20 backdrop-blur-sm transition-all duration-700">
<!-- Inner soft glow to draw focus -->
<div class="absolute inset-4 rounded-full bg-gradient-to-t from-primary-fixed/10 to-transparent blur-xl"></div>
<!-- Abstract human figure representation -->
<div class="relative z-10 flex flex-col items-center opacity-60">
<!-- Head -->
<div class="w-16 h-16 rounded-full border-2 border-primary-fixed mb-2"></div>
<!-- Torso & Legs abstracted -->
<div class="w-24 h-48 border-2 border-t-0 border-b-0 border-primary-fixed rounded-xl flex justify-center">
<div class="w-[2px] h-full bg-primary-fixed/50"></div>
</div>
</div>
</div>
<!-- Corner framing markers to indicate 'camera frame' -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-[3px] border-l-[3px] border-primary-fixed/50 -translate-x-4 -translate-y-4 rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-[3px] border-r-[3px] border-primary-fixed/50 translate-x-4 -translate-y-4 rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-[3px] border-l-[3px] border-primary-fixed/50 -translate-x-4 translate-y-4 rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-[3px] border-r-[3px] border-primary-fixed/50 translate-x-4 translate-y-4 rounded-br-lg"></div>
</div>
<!-- Bottom Section: Status & Actions -->
<div class="w-full max-w-md flex flex-col items-center gap-stack-md pb-stack-md animate-fade-up" style="animation-delay: 0.2s;">
<!-- Scanning Status Indicator -->
<div class="flex items-center justify-center gap-3 bg-inverse-surface/80 backdrop-blur-md px-6 py-3 rounded-full border border-outline-variant/20 shadow-xl">
<span class="material-symbols-outlined text-tertiary-fixed animate-spin" style="animation-duration: 3s;">
                    radar
                </span>
<span class="font-label-md text-label-md text-on-primary">
                    Looking for you...
                </span>
</div>
<!-- Ghost Button for secondary action (exit) -->
<button class="font-label-md text-label-md text-primary-fixed-dim hover:text-on-primary transition-colors duration-300 py-2 px-4 rounded-full hover:bg-white/5">
                End Session
            </button>
</div>
</div>
</body></html>
